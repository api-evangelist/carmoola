aid: carmoola
name: Carmoola
description: 'Carmoola is a UK-based, mobile-first car finance platform that lets consumers get a
  pre-approved budget in minutes through its app, then pay dealers or private sellers directly with a
  virtual card. It offers Hire Purchase (HP) and Personal Contract Purchase (PCP) financing, soft credit
  checks that do not affect the applicant''s score, flexible repayment terms, and the ability to refinance
  an existing car loan. Carmoola is authorised and regulated by the UK Financial Conduct Authority (FCA)
  and is backed by investors including QED Investors. This profile was surfaced as a QED Investors
  portfolio company and enriched by the API Evangelist pipeline; Carmoola operates a consumer app rather
  than a public developer API.'
